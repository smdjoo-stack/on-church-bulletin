<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>온교회 · 주보</title>
<!--
  ┌──────────────────────────────────────────────────────────────────┐
  │  이 파일은 고정 셸입니다 — 디자인(폰트·CSS)을 바꿀 때만 수정하세요.        │
  │  매주 주보 내용은 이 파일이 아니라 latest.json이 가리키는              │
  │  YYMMDD.html(콘텐츠 파일)을 새로 만들어서 반영합니다.                  │
  │  콘텐츠 작성은 template.html을 참고하세요.                            │
  └──────────────────────────────────────────────────────────────────┘
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap">
<style>
  :root{
    --paper:#FBF8F1;
    --cream:#F1E9DA;
    --ink:#2B2620;
    --ink-soft:#4A443B;
    --muted:#8C8273;
    --line:#E2D7C3;
    --line-soft:#EDE5D5;
    --accent:#A6791F;
    --accent-soft:#D6B36B;
    --serif:"Noto Serif KR", serif;
    --display:"Cormorant Garamond", "Noto Serif KR", serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:var(--serif); color:var(--ink); background:var(--cream);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  img{ display:block; max-width:100%; }

  /* 페이지 컨테이너 — 모바일 꽉 차고 데스크탑 중앙 정렬 */
  .page{
    max-width:460px; margin:0 auto; background:var(--cream);
    min-height:100vh;
    box-shadow:0 0 80px -30px rgba(40,34,26,.35);
  }
  @media (min-width:520px){
    body{ background:#DDD4C4; padding:0; }
    .page{ margin-top:0; }
  }

  /* ── 예배 헤더 ───────────────────────────── */
  .hero{ padding:46px 30px 4px; text-align:center; }
  .hero .logo{ width:132px; height:132px; margin:0 auto 18px; object-fit:contain; }
  .hero .crumb{ font-family:var(--display); font-style:italic; font-size:20px; color:var(--muted); }
  .hero h1{ font-size:30px; font-weight:600; letter-spacing:-.4px; margin-top:4px; }
  .hero .date{
    font-family:var(--display); font-size:18px; letter-spacing:2px; color:var(--accent);
    margin-top:10px; text-transform:uppercase;
  }
  .hero .time{
    font-size:14px; color:var(--muted); font-weight:300; letter-spacing:.3px; margin-top:6px;
  }
  .heroimg{ height:clamp(200px,52vw,250px); border-radius:20px; margin:22px 26px 0; overflow:hidden; }
  /* ── 카드 스택 ───────────────────────────── */
  .stack{ padding:24px 26px 36px; display:flex; flex-direction:column; gap:18px; }
  .card{ background:var(--paper); border-radius:20px; padding:26px 24px 28px; }
  .ttl{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .ttl .ko{ font-size:20px; font-weight:600; letter-spacing:-.2px; white-space:nowrap; }
  .ttl::after{ content:""; flex:1; height:1px; background:var(--line); }

  .order{ list-style:none; }
  .order li{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:9px 0; border-bottom:1px dashed var(--line-soft); font-size:16px;
  }
  .order li:last-child{ border-bottom:0; }
  .order .who{ color:var(--muted); font-size:14px; font-weight:300; }
  .order .praise{ flex-direction:column; align-items:stretch; gap:8px; }
  .order .praise .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .order .songs{ list-style:none; display:flex; flex-direction:column; gap:5px; padding-left:2px; }
  .order .songs li{
    display:flex; gap:9px; align-items:baseline; padding:0; border:0;
    font-size:14.5px; color:var(--ink-soft); font-weight:300;
  }
  .order .songs .mk{ font-family:var(--display); font-size:15px; color:var(--accent-soft); min-width:16px; }
  .order .songs li[data-img]{ cursor:pointer; }
  .order .songs li[data-img] span:not(.mk){
    text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;
    text-decoration-color:var(--accent-soft);
  }
  .order .reading{
    margin-top:10px; padding:14px 16px; background:var(--cream); border-radius:12px;
    font-size:14.5px; line-height:1.95; color:var(--ink-soft); font-weight:300;
    text-align:center; text-wrap:pretty;
  }
  .order .reading--scr{ text-align:left; line-height:2; }
  .order .reading--scr .sref{
    display:block; font-family:var(--display); font-size:16px; color:var(--accent);
    letter-spacing:.4px; margin-bottom:6px; font-weight:500;
  }
  .order .reading--scr sup{
    font-family:var(--display); font-size:12px; color:var(--accent-soft);
    margin:0 2px 0 1px; vertical-align:super; font-weight:600;
  }

  .verse .ref{ font-family:var(--display); font-size:18px; color:var(--accent); letter-spacing:.4px; }
  .verse .vt{ font-size:22px; font-weight:600; margin:7px 0 14px; line-height:1.45; letter-spacing:-.3px; }
  .verse p{ font-size:16px; line-height:1.9; color:var(--ink-soft); font-weight:300; }

  .notice{ display:flex; flex-direction:column; gap:16px; }
  .notice .row{ display:flex; gap:14px; }
  .notice .n{ font-family:var(--display); font-size:19px; color:var(--accent-soft); line-height:1.35; min-width:20px; }
  .notice b{ font-weight:600; font-size:15.5px; display:block; margin-bottom:4px; }
  .notice .dt{ font-size:14px; color:var(--muted); font-weight:300; line-height:1.75; text-wrap:pretty; }
  .notice .sched{
    list-style:none; margin-top:9px; display:flex; flex-direction:column; gap:5px;
    background:var(--cream); border-radius:10px; padding:11px 13px;
  }
  .notice .sched li{ display:flex; gap:9px; font-size:13.5px; color:var(--ink-soft); font-weight:300; }
  .notice .sched .wk{ font-family:var(--display); font-size:14px; color:var(--accent); min-width:34px; font-weight:500; }
  .notice .today{
    margin-top:9px; font-size:13.5px; color:var(--accent); font-weight:500; line-height:1.6;
    padding-left:11px; border-left:2px solid var(--accent-soft);
  }
  .notice .pray{ color:var(--accent); font-weight:400; }

  .give{ text-align:center; }
  .give .lead{ font-size:15px; color:var(--ink-soft); font-weight:300; margin-bottom:16px; line-height:1.7; }
  .give .acct{
    display:block; width:100%; background:var(--cream); border:0;
    border-radius:14px; padding:18px; cursor:pointer; font-family:inherit; color:inherit;
    transition:background .18s ease, transform .12s ease;
  }
  .give .acct:hover{ background:#EAE0CC; }
  .give .acct:active{ transform:scale(.985); }
  .give .copyhint{
    font-size:12px; color:var(--accent); margin-top:9px; letter-spacing:.2px;
    transition:color .18s ease;
  }
  .give .acct.copied .copyhint{ color:#3d7a4e; font-weight:500; }
  .give .bk{ font-size:14px; color:var(--muted); }
  .give .no{ font-family:var(--display); font-size:26px; letter-spacing:.6px; margin:4px 0; }
  .give .nm{ font-size:14px; color:var(--ink-soft); }

  .mapwrap{ border-radius:16px; overflow:hidden; margin-bottom:16px; background:#fff; padding:12px; }
  .mapwrap img{ width:100%; height:auto; display:block; border-radius:6px; }
  .addr{ font-size:15px; line-height:1.75; color:var(--ink-soft); font-weight:300; text-align:center; }
  .addr b{ font-weight:600; color:var(--ink); }

  .staff{ list-style:none; }
  .staff .p{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:15px;
  }
  .staff .p:last-child{ border-bottom:0; }
  .staff .role{ color:var(--muted); font-size:13px; font-weight:300; }
  .staff .ph{ font-family:var(--display); font-size:17px; color:var(--accent); letter-spacing:.4px; text-decoration:none; }

  .foot{ text-align:center; padding:30px 0 44px; }
  .foot .mk{ font-family:var(--display); font-style:italic; font-size:18px; color:var(--muted); }
  .foot .cc{ font-size:12px; color:#b3a892; margin-top:7px; }

  /* Premium bulletin viewer button styles */
  .btn-wrap {
    text-align: center;
    margin: 20px 0 10px 0;
  }
  .premium-btn {
    background: linear-gradient(135deg, #E9A300 0%, #FFB300 100%);
    color: #fff;
    border: none;
    border-radius: 25px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(233, 163, 0, 0.3);
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    outline: none;
    font-family: inherit;
  }
  .premium-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(233, 163, 0, 0.4);
    background: linear-gradient(135deg, #FFA000 0%, #FFB300 100%);
  }
  .premium-btn:active {
    transform: translateY(1px);
  }

  /* Premium bulletin preview card styles */
  .bulletin-preview-wrap {
    margin: 20px auto 10px;
    width: 100%;
    max-width: 100%;
    text-align: center;
  }
  .bulletin-preview-title {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .bulletin-preview-card {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(43, 38, 32, 0.15);
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(230, 220, 200, 0.4);
    background: #fff;
  }
  .bulletin-preview-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(43, 38, 32, 0.25);
  }
  .bulletin-preview-card:active {
    transform: translateY(-1px);
  }
  .bulletin-thumbnail {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s ease;
  }
  .bulletin-preview-card:hover .bulletin-thumbnail {
    transform: scale(1.03);
  }
  .bulletin-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.35) 60%, rgba(0, 0, 0, 0) 100%);
    padding: 24px 12px 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    color: #fff;
    gap: 4px;
  }
  .bulletin-overlay .view-icon {
    font-size: 18px;
    margin-bottom: 2px;
    animation: preview-pulse 2s infinite;
  }
  .bulletin-overlay .view-text {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  @keyframes preview-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  /* 지난 주보 보기 */
  .archive-heading{
    display:block; text-align:center; padding:0 0 16px; font-size:13px;
    color:var(--muted); font-family:inherit;
  }
  .archive-list{
    list-style:none; max-width:460px; margin:0 auto; padding:0 26px 40px;
    display:flex; flex-direction:column; gap:8px;
  }
  .archive-list a{
    display:block; padding:12px 16px; background:var(--paper); border-radius:12px;
    color:var(--ink-soft); text-decoration:none; font-size:14px; text-align:center;
  }
  .archive-list a:hover{ background:#EAE0CC; color:var(--accent); }

  /* 이미지 보기 모달 (찬양 악보/가사 이미지 등 범용) */
  .img-modal-overlay{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(43,38,32,.85); z-index:100000;
    display:none; align-items:center; justify-content:center;
    opacity:0; transition:opacity .2s ease;
  }
  .img-modal-overlay.active{ display:flex; opacity:1; }
  .img-modal-content{
    position:relative; width:90%; max-width:460px; max-height:85vh;
    background:var(--paper); border-radius:16px; padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;
  }
  .img-modal-content img{ max-width:100%; max-height:calc(85vh - 32px); border-radius:8px; }
  .img-modal-close{
    position:absolute; top:-14px; right:-14px; width:32px; height:32px;
    border-radius:50%; border:0; background:var(--ink); color:#fff;
    font-size:18px; line-height:1; cursor:pointer;
  }
</style>
</head>
<body>
  <div id="app">
    <main class="page"><div style="padding:80px 20px;text-align:center;color:var(--muted);font-size:14px;">불러오는 중...</div></main>
  </div>
  <div class="archive-heading" id="archive-heading" style="display:none;">지난 주보 보기</div>
  <ul class="archive-list" id="archive-list"></ul>

  <div class="img-modal-overlay" id="img-modal">
    <div class="img-modal-content">
      <button type="button" class="img-modal-close" id="img-modal-close">&times;</button>
      <img id="img-modal-img" src="" alt="">
    </div>
  </div>

<script>
(function() {
  var app = document.getElementById('app');

  // 헌금 계좌 탭-복사 버튼(콘텐츠 프래그먼트의 onclick="copyAcct(this)"가 참조)
  window.copyAcct = function(btn) {
    var acct = btn.getAttribute('data-acct');
    if (!acct || !navigator.clipboard) return;
    navigator.clipboard.writeText(acct).then(function() {
      btn.classList.add('copied');
      setTimeout(function() { btn.classList.remove('copied'); }, 2000);
    });
  };

  function loadWeek(name) {
    return fetch(name, { cache: 'no-store' })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(html) { app.innerHTML = html; })
      .catch(function(err) {
        app.innerHTML = '<main class="page"><div style="padding:80px 20px;text-align:center;color:var(--muted);font-size:14px;">주보를 불러오지 못했습니다.</div></main>';
        console.error('[bulletin] load failed:', name, err);
      });
  }

  // 주보 이미지 뷰어 — 클릭하면 다음 장. 이미지 목록은 각 콘텐츠 파일이
  // data-viewer-images로 제공하므로 이 스크립트는 어느 주에도 재사용된다.
  document.addEventListener('click', function(e) {
    var card = e.target.closest('#btn-view-bulletin');
    if (!card) return;
    var images;
    try { images = JSON.parse(card.getAttribute('data-viewer-images') || '[]'); }
    catch (err) { images = []; }
    if (!images.length) return;
    var idx = (parseInt(card.getAttribute('data-viewer-idx') || '0', 10) + 1) % images.length;
    card.setAttribute('data-viewer-idx', idx);
    var img = document.getElementById('main-bulletin-img');
    var indicator = document.getElementById('main-bulletin-indicator');
    if (img) img.src = images[idx];
    if (indicator) indicator.textContent = (idx + 1) + ' / ' + images.length + ' (클릭하면 다음 장)';
  });

  // 이미지 보기 모달 — 찬양곡 등 [data-img] 속성이 붙은 요소를 클릭하면 그 이미지를 크게 보여준다.
  (function() {
    var modal = document.getElementById('img-modal');
    var modalImg = document.getElementById('img-modal-img');

    function closeModal() { modal.classList.remove('active'); }

    document.addEventListener('click', function(e) {
      var trigger = e.target.closest('[data-img]');
      if (trigger) {
        modalImg.src = trigger.getAttribute('data-img');
        modalImg.alt = trigger.textContent.trim();
        modal.classList.add('active');
        return;
      }
      if (e.target === modal || e.target.id === 'img-modal-close') closeModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  })();

  fetch('latest.json', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(data) { return loadWeek(data.latest); })
    .catch(function(err) { console.error('[bulletin] latest.json load failed:', err); });

  // 최근 8개까지만 표시. 그 이상은 archive.json에는 남아있지만 목록엔 안 뜬다.
  var ARCHIVE_LIMIT = 4;

  fetch('archive.json', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(archive) {
      var list = document.getElementById('archive-list');
      var names = Object.keys(archive).sort().reverse().slice(0, ARCHIVE_LIMIT);
      if (!names.length) return;
      names.forEach(function(name) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#';
        a.textContent = (archive[name] && archive[name].label) || name;
        a.addEventListener('click', function(e) {
          e.preventDefault();
          loadWeek(name);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        li.appendChild(a);
        list.appendChild(li);
      });
      document.getElementById('archive-heading').style.display = 'block';
    })
    .catch(function(err) { console.error('[bulletin] archive.json load failed:', err); });
})();
</script>
</body></html>
